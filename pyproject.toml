[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "md2conf-dc"
version = "0.1.0"
description = "Typed Markdown and Obsidian publisher for Confluence Data Center 9.2"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
authors = [{name = "md2conf-dc contributors"}]
dependencies = [
  "filelock>=3.16,<4",
  "httpx>=0.27,<1",
  "lxml>=5.3,<7",
  "markdown-it-py>=3.0,<5",
  "mdit-py-plugins>=0.4,<1",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "ruamel.yaml>=0.18,<1",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
keyring = ["keyring>=25.5,<26"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
md2conf = "md2conf_dc.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md2conf_dc"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["md2conf_dc"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=md2conf_dc --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests_python"]
